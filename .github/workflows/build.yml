
name: Build Project Glass V2

on:
  workflow_dispatch:
  push:
    paths:
      - 'ProjectGlass_V2_FIXED_GitHub_Build.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project Glass
        run: |
          mkdir -p source
          unzip -o ProjectGlass_V2_FIXED_GitHub_Build.zip -d source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-Glass-V2-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          
